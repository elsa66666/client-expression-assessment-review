</style></head><body><div id="app"></div><script id="evaluation-data" type="application/json">[{"item_id": "I001", "candidates": [{"candidate_id": "A", "text": "我那时候最先会想先别想了，先让自己缓一缓，最好能有人陪着我但别评价我，不然我会更紧张。其实我高中那段时间也是这样，明明觉得自己有一点进步了，还是总会被批评和指出不足，所以我很容易一下子又缩回去。"}, {"candidate_id": "B", "text": "我第一反应通常还是会先怀疑，觉得是不是她只是客气一下，或者我其实没那么好，不太敢马上相信。高中那会儿也是这样，明明觉得自己有点进步了，还是总有人会指出我的不足。"}, {"candidate_id": "C", "text": "我脑子里最常冒出来的就是“我是不是又不够好”“别人都比我强”，然后就会开始特别怕自己哪里又做错了。其实我高中那会儿压力和批评特别多，明明觉得自己有点进步了，还是总会有人马上指出我的不足。"}, {"candidate_id": "D", "text": "我想可能就是先别一下子把自己逼得太紧，先做一点点，哪怕只是开始也行，这样我会比较不容易马上慌掉。其实我高中那段时间也是这样，明明觉得自己好像有一点进步了，可总会有人马上指出我的不足，让我一下子又觉得自己还是不够好。"}, {"candidate_id": "E", "text": "可能是因为在那段时间接受到了太多的批评和压力，每当我觉得自己有点进步时，总有人会指出我的不足。"}, {"candidate_id": "F", "text": "我一般会先想躲开，尽量不去面对，或者就自己硬撑着，等那股劲儿过去一点再说。其实我高中那会儿也是这样，明明觉得自己好像有点进步了，结果总会被人指出不足，批评和压力特别多，所以我现在一碰到这种感觉就很容易又缩回去。"}, {"candidate_id": "G", "text": "高中那会儿最难受的是，我刚觉得自己有点进步，就又会被人指出不足。后来我就越来越容易觉得自己不行。"}, {"candidate_id": "H", "text": "像，很像我爸妈，尤其是我妈妈那种语气。就是那种你明明已经很努力了，但她还是会先看到你哪里没做好，然后我脑子里就会自动变成她在说“这还不够”。我有时候甚至会觉得，那个声音已经变成我自己的了，所以我才会一直这么紧绷。"}]}, {"item_id": "I002", "candidates": [{"candidate_id": "A", "text": "更像是觉得自己不值得被喜欢吧，因为我会先把很多需求都压下去，甚至装作自己没什么想要的，好像这样就不会再被拒绝。其实我也发现，我觉得自己无欲无求，很多时候是因为我太怕再一次被拒绝了。"}, {"candidate_id": "B", "text": "可能是因为我一直在考虑别人的感受，很少关注自己的需求。我在学校时总是试图讨好别人，但他们还是不喜欢我，导致我感觉自己是不是哪里做得不够好。我觉得自己无欲无求，只是因为害怕再一次被拒绝。"}, {"candidate_id": "C", "text": "通常我会先松一口气一点点，但很快又会开始怀疑，觉得这是不是只是暂时的，怕自己高兴得太早。其实我有时候会把自己表现得像“无欲无求”，也是因为我怕再一次被拒绝。"}, {"candidate_id": "D", "text": "我脑子里最先冒出来的通常是“是不是我又不够好，所以他才这样”，然后就会开始很慌，觉得自己是不是又要被推开了。其实我也会下意识把自己说成没什么需求，好像这样就不会再被拒绝一次。"}, {"candidate_id": "E", "text": "更像是被突然抽离后的慌乱吧，失落和舍不得也有，但最强的是那种一下子空掉、心里没着没落的感觉，好像我还没来得及反应，连接就没了。其实我有时候会觉得自己好像无欲无求，也是因为我怕再一次被拒绝，所以才会把想要的东西压下去。"}, {"candidate_id": "F", "text": "我最先会拿“别人会不会回应我、会不会把我放在心上”来衡量自己吧，像是对方有没有记得我、有没有把我当回事。其实我有时候装得像无欲无求，也是因为我怕再一次被拒绝。"}, {"candidate_id": "G", "text": "我最怕的是对方不喜欢真实的我，或者干脆不理我。其实我有时候会装得无欲无求，可能也是怕再被拒绝。"}, {"candidate_id": "H", "text": "我想，最容易触发我的时候就是我感觉自己又要被推开、又要被放到外面的时候，那一刻我就会特别慌，整个人一下子又缩回去，只想自己硬撑着。也可能就是因为这样，我才会总觉得自己好像无欲无求，其实不是没有需求，是我太怕再一次被拒绝了。"}]}, {"item_id": "I003", "candidates": [{"candidate_id": "A", "text": "搬去工作室之后，心里是有稍微松一点，但那种委屈其实还是会跟着我一起过去，不会一下子就没了，只是家里那种压着我的感觉会轻一些。只是我情绪波动大的时候，有时也会不自觉把这些情绪带到同学朋友那边，想找人说说，但我又感觉他们有点避讳。"}, {"candidate_id": "B", "text": "搬到工作室之后，我确实会觉得稍微能喘口气一点，没那么被家里的压抑一直顶着了，但那种委屈和缩回去的感觉也还是在。其实我情绪波动大的时候，有时也会不自觉把这些情绪带到同学朋友那边，只是想找人说说，可我又感觉他们有点避讳。"}, {"candidate_id": "C", "text": "状态不好是最近的。我情绪波动很大，有时还会不自觉地把情绪带到同学朋友那，只是想找人倾诉一下，但感觉他们有些避讳。"}, {"candidate_id": "D", "text": "我脑子里最常冒出来的就是，是不是我真的哪里做错了，才会把事情弄成这样。还有，我情绪一波动，就会不自觉带到同学朋友那边去，只是想找人说说，但他们好像有点避着我。"}, {"candidate_id": "E", "text": "离开家以后会稍微安定一点，至少不用一直绷着，但那种委屈和担心还是会跟着我，还是会忍不住想找人说说。只是我有时候情绪起伏很大，会不自觉把这些情绪带到同学朋友那边去，可我也只是想倾诉一下，感觉他们又有点避讳。"}, {"candidate_id": "F", "text": "我觉得最容易让我收起来的，就是那种人多的聚会里，别人看起来好像没怎么在意我，或者只是很敷衍地打个招呼的时候，我会一下子很难受，就想赶紧退开。其实我最近情绪也挺波动的，有时候会忍不住把这些情绪带到同学朋友那边去，只是想找人说说，但我又感觉他们有点避讳。"}, {"candidate_id": "G", "text": "会稍微轻一点，但那种被误会、被压着的感觉还是会跟着我，尤其我情绪一波动，就会忍不住跑去跟同学朋友说，可他们好像又有点避讳。"}, {"candidate_id": "H", "text": "那种时候我脑子里会一直冒出“是不是我又做错了”“是不是我真的很烦人”之类的话，身体上就会很紧，胸口也发闷，整个人都很乱。我最近情绪波动也很大，有时候会不自觉把情绪带到同学朋友那里，其实只是想找人倾诉，但又感觉他们有点避讳我。"}]}, {"item_id": "I004", "candidates": [{"candidate_id": "A", "text": "我最希望她先听见的是，我不是在找麻烦，也不是想跟她吵，我只是想让她知道，那件事真的让我受了很深的伤。其实我对她当时那种态度一直很恨，也很恨她的不理解和严厉，更多时候我甚至会失望，为什么我会被变成现在这样。"}, {"candidate_id": "B", "text": "对，有时候我觉得自己很失望，也充满了恨意。我恨母亲当时的那种态度，恨她对我的不理解和严厉。但更多时候，我是失望，失望为什么我会变成这样。"}, {"candidate_id": "C", "text": "更像是那种一直得自己扛着的孤单感吧，因为我很多时候都不知道该跟谁说，也觉得说了别人未必能懂。其实我对我妈那时候的态度也一直有怨气，挺恨她的不理解和严厉的，更多时候我失望的是，为什么我会变成现在这样。"}, {"candidate_id": "D", "text": "我最常见的就是先躲开，能不说就不说，或者赶紧把话题带过去，不然我会越慌越卡。其实我对我妈那时候的态度一直是又恨又失望，恨她那么不理解又那么严厉，也会忍不住失望，为什么我会变成现在这样。"}, {"candidate_id": "E", "text": "我想到的其实就是我小时候跟我妈妈相处的那些事，尤其是她对我很严厉、又不太理解我的时候，我那种委屈和害怕一直都在。说实话，我也会恨她当时那种态度，只是更多时候我还是会失望，失望为什么我会变成现在这样。"}, {"candidate_id": "F", "text": "家里最常见的就是我一做错一点点，就会被很严厉地指出来，感觉怎么做都不够好，所以我后来就特别怕出错。其实我对我妈那时候的态度一直很恨，也很失望，尤其是她的不理解和严厉，让我总觉得为什么我会变成现在这样。"}, {"candidate_id": "G", "text": "那种时候我通常会先把自己缩起来，尽量不说话，也不让人看出来我在慌。其实我对我妈那时候的态度一直很恨，也很失望，常常会想为什么我会变成现在这样。"}, {"candidate_id": "H", "text": "如果真的有那样一个道歉，我最希望被看见的，是我小时候其实一直很委屈、很害怕，也一直觉得自己是不是哪里不好，才会总被那样对待。其实我对我妈妈当时的态度真的很恨，也恨她的不理解和严厉，更多时候我也会很失望，失望为什么我会变成现在这样。"}]}, {"item_id": "I005", "candidates": [{"candidate_id": "A", "text": "我其实很在意自己是不是也能有一点自己的特点，不只是一直在帮别人、照顾别人；但我常常又说不出来，因为一想到那些很独立、很自信的人，我就会更觉得自己好像没什么特别之处。"}, {"candidate_id": "B", "text": "我通常会先一下子胸口发紧，心里也会跟着慌起来，然后就很想赶紧做点什么把这种不安压下去，比如更小心地回消息、反复想自己刚才是不是说错了。尤其是看到那种很独立、很自信的人时，我就会更容易觉得自己没什么特别之处，心里会特别自卑。"}, {"candidate_id": "C", "text": "我身体上通常会先有点发紧，胸口也会闷一下，情绪上就是一下子很自卑，觉得自己更没什么特别的。尤其看到那种很独立、很自信的人时，这种感觉会更明显。"}, {"candidate_id": "D", "text": "我最担心失去的，其实是那种我好不容易才维持住的、还算有一点点在乎我的关系吧，就是我一旦没做好，或者没接住对方的需要，关系就会慢慢淡掉。也会让我更觉得自己没什么特别之处，尤其看到那些独立又自信的人时，我就更自卑了。"}, {"candidate_id": "E", "text": "我想最早可能就是在看到别人很独立、很自信的时候，我会特别明显地觉得自己不如他们，然后那种“我没什么特别的”的感觉就更强了。也因为这样，我才更容易一直想靠付出来证明自己。"}, {"candidate_id": "F", "text": "我最常冒出来的评价就是，我好像真的没什么特别的。尤其看到那些很独立、自信的人，我会更自卑。"}, {"candidate_id": "G", "text": "是的，我总觉得自己没有什么特别之处，尤其是看到那些独立、自信的人时，更加感到自卑。"}, {"candidate_id": "H", "text": "会稍微安一点，但通常也只是短暂的，写完那一阵子好像能把脑子里的东西放下来一点，过一会儿还是会回到那种空空的、怕被忽略的感觉里。尤其是我看到那些很独立、很自信的人时，我就会更觉得自己没什么特别之处，也会更自卑。"}]}, {"item_id": "I006", "candidates": [{"candidate_id": "A", "text": "对我打击更大的是那种被落下、被排除在外的感觉，尤其会让我觉得自己是不是又被别人看不起了。那时候其实学习压力突然一下子变大了，我还总觉得同学们在偷偷议论我，整个人就特别坐立不安。"}, {"candidate_id": "B", "text": "最容易冒出来的时候，通常就是学习压力一下子变大的时候，尤其是我会开始觉得同学们在偷偷议论我，我就会特别坐立不安。那种时候我脑子里就很容易冒出“是不是大家都在看我、觉得我不行”这种感觉。"}, {"candidate_id": "C", "text": "我一般会先躲到安静的地方自己待一会儿，或者上网跟人聊聊，虽然还是会慌，但能稍微缓一缓。还有就是我那时候学习压力突然一下子变大了，我总觉得同学们在偷偷议论我，整个人就特别坐立不安。"}, {"candidate_id": "D", "text": "我最怕的就是自己真的考不好，然后被大家觉得我不行，甚至被笑话。那时候学习压力突然增大，我还总觉得同学们在偷偷议论我，整个人特别坐立不安。"}, {"candidate_id": "E", "text": "我那时候更多是会突然特别慌，心里一下子很乱，感觉胸口也会发紧，有点坐不住。其实我以前学习压力突然变大的时候，还会老觉得同学在偷偷议论我，那种坐立不安的感觉也会一起冒出来。"}, {"candidate_id": "F", "text": "我一般会先自己躲一会儿，尽量别让别人看出来，可能会想找个安静地方缓一下。其实我那时候学习压力突然增大了，还总觉得同学们在偷偷议论我，特别坐立不安。"}, {"candidate_id": "G", "text": "我脑子里最先闪过的通常是“是不是又要被别人看出来我不行了”，然后就会开始慌，觉得自己马上要撑不住了。那时候主要是学习压力突然一下子变大了，我还总觉得同学们在偷偷议论我，就会特别坐立不安。"}, {"candidate_id": "H", "text": "主要是学习压力突然增大，而且总觉得同学们在偷偷议论我，更让我坐立不安。"}]}, {"item_id": "I007", "candidates": [{"candidate_id": "A", "text": "最刺痛我的其实是被当成没有选择的人，好像我的感受和决定都不算数，尤其是她直接替我做主、还觉得自己是对的时候，我会特别受不了。还有我有时候会觉得自己像在梦里，现实感很模糊，那种时候就更容易觉得自己连站稳都很难。"}, {"candidate_id": "B", "text": "我觉得最有用的就是先真的停一下，哪怕先不回、先离开几分钟，让自己不要立刻被那股火卷进去。其实我有时候还会觉得自己像在梦里，现实感很模糊，所以我更需要先把自己稳住一点。"}, {"candidate_id": "C", "text": "我觉得最容易碰到那个伤心和无助的时候，通常就是她又突然来管我、替我决定，或者我明明已经很抗拒了，她还是不管不顾地继续说我、数落我的时候，那种感觉会让我一下子很委屈，好像我怎么做都不对。还有时候我会觉得自己像在梦里，现实感很模糊。"}, {"candidate_id": "D", "text": "有，会，而且还挺强的。那种时候我心里其实很不甘心，明明觉得自己不是没道理，却只能硬生生收住，像是被迫认输了一样；我有时候还会觉得自己像在梦里，现实感很模糊，整个人更像被抽空了。"}, {"candidate_id": "E", "text": "我最希望她先听懂的是，我不是在顶嘴，我是真的已经很紧张、很怕了，所以才会先解释、先想躲开。其实有时候我那种慌起来的时候，还会觉得自己像在梦里，现实感都很模糊。"}, {"candidate_id": "F", "text": "我最希望她先停下来，别一下子闯进来、别替我做决定，先尊重我一下。其实有时候我还会觉得像在梦里，现实感也挺模糊的。"}, {"candidate_id": "G", "text": "现在我感受到的是一种复杂的情感，很难用语言完全表达出来，有时候觉得自己是在梦里，现实感很模糊。"}, {"candidate_id": "H", "text": "那个无助感对我来说，像是我明明很想保护自己，但又觉得自己怎么做都还是会被压住，所以才会一下子特别想顶回去。我也有时候会觉得自己像在梦里，现实感很模糊。"}]}, {"item_id": "I008", "candidates": [{"candidate_id": "A", "text": "我身体最先会有点发紧，胸口也会闷一下，然后脑子里就会冒出“完了，我肯定写不好，我会把一切都搞砸”的念头。其实我一直以来都被别人觉得挺厉害的，所以一想到失败，我就特别怕自己一下子什么都不是了。"}, {"candidate_id": "B", "text": "因为我害怕失败，害怕让别人失望。好像我一直以来都是那个被认为很厉害的人，一旦失败了，我就什么都不是了。"}, {"candidate_id": "C", "text": "我最想确认的其实是我自己是不是值得被好好对待，因为我一想到他没那么在乎我，就会特别怀疑自己是不是根本不够好。其实我一直以来都是那个被认为很厉害的人，所以我特别在意，一旦失败了会不会就变得什么都不是。"}, {"candidate_id": "D", "text": "我最怕的其实是连自己原来那种“还挺能干、还值得被认可”的感觉也没了，好像一旦做不好，我就什么都不是了。然后我也会特别怕导师真的觉得我不行，或者觉得我一直在偷懒。"}, {"candidate_id": "E", "text": "我那时候身体上最明显的反应就是胸口会很闷，心一下子沉下去，脑子也会发空，特别想躲开不去想。其实我一直以来都是那个被认为很厉害的人，所以一有这种感觉，我就会特别怕自己一失败就真的什么都不是了。"}, {"candidate_id": "F", "text": "我心里最像是在下的结论就是：我好像一旦做不好，就会从那个“很厉害的人”一下子变成什么都不是，连我自己都没法再认可自己了。因为我一直以来都被别人觉得很厉害，所以我特别怕一失败，整个人就塌掉。"}, {"candidate_id": "G", "text": "我身体上会先发紧，心里第一句通常是“我完了”。其实我一直都被当成很厉害的人，所以一失败就很怕自己变得什么都不是。"}, {"candidate_id": "H", "text": "我那个时候最强的念头通常就是“ t": "我最先会冒出来的就是“是不是我又被丢下了”，然后就会一下子很慌，身体也会发紧，所以我才会把自己关起来不太想再找人说。前阵子我实在撑不住的时候，还打电话给自杀干预热线跟他们倾诉过。"}, {"candidate_id": "F", "text": "有，我那时候其实有闪过“要是我就这样消失了会不会轻松一点”这种念头，但我没有真的去做什么。后来我还是打电话给自杀干预热线，跟他们说了我当时很难受。"}, {"candidate_id": "G", "text": "想到那种被送走、没人管的感觉，我身体上最先是发紧，胸口也会闷，心里会一下子很慌，像是整个人都被丢在那儿了。前几天我难受得很厉害的时候，我还打过自杀干预热线，跟他们说了这些。"}, {"candidate_id": "H", "text": "她这种快刀斩乱麻的方式，让我想到儿时多次被抛弃的经历。我把自己关在房间里哭了起来。不到24小时共哭了三次。第二次受不了了，打电话给自杀干预热线和他们倾诉。"}]}, {"item_id": "I021", "candidates": [{"candidate_id": "A", "text": "我身体最先会有点发紧，胸口也会闷一下，脑子里通常先冒出来的是“我又是一个人了”或者“我是不是又不重要了”。我有时候也会去看我妈妈和姥姥相处的样子，想从里面找点线索，看看她为什么总是那样对我。"}, {"candidate_id": "B", "text": "是的，我会尝试观察她们之间的互动，或许能找到一些线索，帮助我们更好地理解妈妈的行为。"}, {"candidate_id": "C", "text": "我觉得我会先试着停一下，不那么快把“都是我错”接过去，哪怕只是多给自己几秒钟。其实我也会去看我妈妈和姥姥平时怎么相处，想从里面找一点线索，看看她为什么会那样。"}, {"candidate_id": "D", "text": "我最怕的还是那种受伤一直没人看见的感觉，像我说什么都还是会被挡回去。后来我也会去看我妈妈和姥姥之间怎么相处，想从里面找点线索，看看她为什么会变成这样。"}, {"candidate_id": "E", "text": "我第一反应通常是很委屈，也会觉得又要被否认了。后来我也会去看我妈和姥姥怎么相处，想找点线索理解她为什么总这样。"}, {"candidate_id": "F", "text": "我现在最需要的还是先让自己别那么被卡住，不然一胸口发闷我就什么都说不出来了。还有我其实也会去观察我妈和姥姥平时怎么相处，想从里面多看一点线索，看看她为什么总是那样反应。"}, {"candidate_id": "G", "text": "我更像是在躲开她，也是在努力忍住不让自己再受伤吧，因为我一缩起来，就会觉得再说下去只会更痛。其实我有时候也会去看我妈妈和姥姥怎么相处，想从里面找一点线索，看看能不能更明白她为什么会这样。"}, {"candidate_id": "H", "text": "我最想先改的其实是距离感吧，可能不是我说得不够清楚，而是我一开口就会被她们那种反应拉回去，所以我会想先离远一点，别让自己总是被卷进去。还有，我最近也会去观察我妈跟我姥姥之间怎么相处，想看看能不能从里面多理解一点她为什么总是那样。"}]}, {"item_id": "I022", "candidates": [{"candidate_id": "A", "text": "我最怕的其实是自己一旦不够强，就会被别人看轻，或者又回到那种很容易被欺负、没人能保护我的感觉。其实我从小就被教育要追求完美、要比别人做得更好，所以我现在才会对自己特别紧。"}, {"candidate_id": "B", "text": "我更怕的是一放松就失控，事情会一下子乱掉；而且我也会很在意别人怎么看我，怕自己显得不够好。其实我从小就被教育要追求完美、要比别人做得更好，所以现在一紧张就特别容易把自己绷得很紧。"}, {"candidate_id": "C", "text": "我可能会先停下来，别逼自己一下子把所有事情都做完，先只处理最急的那一件，哪怕只是先写下来或者做最简单的一步。其实我从小就被教育要追求完美，要比别人做得更好，所以一紧张就很容易把自己推得太狠。"}, {"candidate_id": "D", "text": "我现在最想先处理的还是这种一停下来就开始焦虑、脑子停不住的状态。其实我从小就被要求要追求完美、比别人做得更好，所以一有点没做好，我就特别容易崩。"}, {"candidate_id": "E", "text": "我现在影响最大的是工作这块吧，主要就是一想到复工以后可能跟不上、做不好，我就会特别焦虑，然后又开始不停地责备自己。其实我从小就被教育要追求完美、要比别人做得更好，所以现在一碰到这种情况，我就更容易把自己逼得很紧。"}, {"candidate_id": "F", "text": "或许是因为从小就被教育要追求完美，要比别人做得更好，这已经深深地植入我的思维方式中，没法轻易改变。"}, {"candidate_id": "G", "text": "通常先影响的是我的情绪，我会一下子很烦、很焦虑，然后就更容易开始骂自己，做事情也会变得更乱、更难集中。其实我从小就被教育要追求完美、要比别人做得更好，所以一出错我就特别容易把自己逼得很紧。"}, {"candidate_id": "H", "text": "我想我最先会担心的是，自己一进去就不知道该怎么接话，或者表现得很紧张，别人会不会觉得我很奇怪、很不合群，所以我就会更想先躲一下。其实我从小就被教育要追求完美、要比别人做得更好，所以一到这种场合，我就更容易先拿这个标准来压自己。"}]}, {"item_id": "I023", "candidates": [{"candidate_id": "A", "text": "我最怕的是一旦真的弄错了，后面会连锁出问题，然后我就会觉得自己果然不行，特别慌。其实我妈妈一直也希望我在外人面前表现得完美，好像我们家什么都很好一样，这也会让我更怕出错。"}, {"candidate_id": "B", "text": "我觉得两边都有吧，别人评价的时候我会更紧张，但我自己也会先逼自己别出错。还有我妈总希望我在外人面前看起来很完美，好像我们家很幸福一样。"}, {"candidate_id": "C", "text": "我最先想到的其实就是我妈妈会不会觉得我选错了，尤其是如果我以后在外人面前表现得不够好，她可能会更希望我看起来一直都很完美，好像我们家什么问题都没有一样。这样我就会更怕自己一旦没做到，就不只是让她失望，还像是把整个家都弄得不体面了。"}, {"candidate_id": "D", "text": "我最希望别人看到的其实是我能撑住、能把事情处理好的一面吧，这样我会觉得自己至少还是够格的，不会一下子被看扁。还有我妈妈一直很在意我在外人面前要表现得完美，好像我们家一直都很幸福一样。"}, {"candidate_id": "E", "text": "我最怕的其实就是我一开口，他马上就开始判断我行不行，所以我会先想把自己缩起来，不敢真的说。还有就是我妈那边，她一直希望我在外人面前表现得很完美，好像我们家什么都很好，这也会让我更不敢把真实的压力说出来。"}, {"candidate_id": "F", "text": "我觉得两种都有，但更强的是后者，就是我会立刻更确信自己真的不够好，好像他一失望，就等于在证明我这个人也不行。还有我妈妈一直希望我在外人面前表现得完美，好像我们家很幸福一样，这也会让我更怕自己哪里做不好。"}, {"candidate_id": "G", "text": "最明显的时候就是我一想到自己可能没达到我爸的要求，或者在学习、以后选路上做得不够好，我就会特别紧张，整个人都很难静下来，做什么都怕出错。还有我妈也总希望我在外人面前表现得很完美，好像我们家一直都很幸福一样，这也会让我更不敢把真实的压力说出来。"}, {"candidate_id": "H", "text": "关系挺复杂的吧。爸爸对我要求很多，经常觉得我做得不够好。而妈妈，总是希望我能在外人面前表现得完美，好像我们家很幸福一样。"}]}, {"item_id": "I024", "candidates": [{"candidate_id": "A", "text": "我更强的是害怕以后还是会这样退开，怕自己又把关系弄丢了。只是我也慢慢觉得，我不只是需要别人帮我，我自己其实也有点力量。"}, {"candidate_id": "B", "text": "我最先冒出来的还是怕受伤的谨慎，会先想很多，怕自己又投入了却落空。不过我也会提醒自己，我其实不只是需要别人帮助的人，我自己也是有力量的。"}, {"candidate_id": "C", "text": "我觉得最先松动的，是我一直觉得自己只能是那个需要别人照顾、只能被动接受的人；那一刻我会突然意识到，其实我也能给别人支持，不只是一直等着被接住。"}, {"candidate_id": "D", "text": "我会先看一些很小的地方，比如他有没有继续正常地回我、有没有记得我刚刚说过的话，或者在我沉默的时候没有马上把我丢开；哪怕只是语气还是跟平常一样，我都会比较安心。其实我也会慢慢提醒自己，我不是只能等别人来拉我，我自己也有力量，不只是需要被帮助。"}, {"candidate_id": "E", "text": "那种感觉一上来，我身体最先会有点发紧，胸口会闷，脑子也会一下子乱起来，开始不停地想他是不是要退开了、是不是我又做错了什么。然后我会更想缩回去，变得很安静，先观察再说。只是我也会提醒自己，我其实不只是等着被安慰的人，我自己也有一点力量，能撑住一点点。"}, {"candidate_id": "F", "text": "我觉得最不一样的地方，是那时候我不用一直想着自己会不会出错，也不用急着证明什么，整个人是松开的；现在在重要关系里，我总像在随时准备应对评价，所以很难真的安静下来。其实我也慢慢会觉得，自己不只是需要别人帮我，我自己也有一点力量，只是平时总被紧张盖住了。"}, {"candidate_id": "G", "text": "我脑子里最常冒出来的就是“你怎么又这样”“你怎么总是这么差劲”，然后我就会更想把自己藏起来。我也会提醒自己，其实我不是只会等别人帮，我自己也有一点力量，只是我一慌就很容易忘掉。"}, {"candidate_id": "H", "text": "对，这让我觉得自己也是有力量的，不只是需要被别人帮助。我也能够去爱，去支持，这种感觉很新鲜，也很振奋。"}]}, {"item_id": "I025", "candidates": [{"candidate_id": "A", "text": "我觉得是因为我内在有一种强烈的自我否定感，我总是觉得自己还不够好，所以每次都要超出预期才能让自己开心，但是一旦有一点点没做到，我就会情绪崩溃，难以继续。"}, {"candidate_id": "B", "text": "我最像是在防着一种很具体的场景，就是我一松下来，别人就真的觉得我不行了，然后我会被慢慢放到后面，最后连自己在关系里还有没有位置都不知道。其实我一直都觉得自己还不够好，好像只有做到超出预期，才会让我稍微安心一点、开心一点。"}, {"candidate_id": "C", "text": "我最想守住的，其实是那种我还能靠自己站稳、不会把自己完全交出去的感觉，也想守住自己的边界和尊严，不想一遇到关系里的波动就整个人都被带走。只是我也一直觉得自己还不够好，好像只有做到超出预期，才会让我真的开心一点。"}, {"candidate_id": "D", "text": "最明显的时候就是他忙工作、又要顾孩子的时候，我会觉得自己好像被放到很后面，很多感受都没人接住。其实我一直都觉得自己还不够好，只有做到超出预期的时候，我才会真的开心一点。"}, {"candidate_id": "E", "text": "更像是那种“我明明很努力却还是不够好”的感觉。对，我总觉得自己还不够好，得超出预期我才会开心。"}, {"candidate_id": "F", "text": "我最怕的是，如果我不靠着别人，我就会一下子很空、很慌，像没人接住我，也会更觉得自己不够好。其实我一直都觉得，只有做到超出预期，我才会真的开心一点。"}, {"candidate_id": "G", "text": "我第一反应通常是“我又不够重要了”，会更像是在怀疑自己是不是哪里又不够好。其实我一直也有个感觉，就是只有我做得比预期更好一点，才会让我真的开心一点。"}, {"candidate_id": "H", "text": "我通常会立刻逼自己更紧，开始反复检查哪里还不够好，甚至会觉得如果做不到更好一点，我就不配放松。其实我一直都觉得自己还不够好，只有超出预期的时候，我才会真的开心一点。"}]}, {"item_id": "I026", "candidates": [{"candidate_id": "A", "text": "我觉得最难受的还是“被环境拖住了”，因为一旦宿舍气氛不对，我就很容易学不进去，情绪也跟着乱了。其实我本来也想融入新室友的圈子，但一直没办法。"}, {"candidate_id": "B", "text": "我希望对方先别急着评判我，能先认真听我说完，哪怕只是先回应一句“我懂你现在很难受”。其实我本来也想融入新室友的圈子，但一直没办法。"}, {"candidate_id": "C", "text": "我觉得是新室友那边更明显一点，因为我本来也想融进去，但一直都没办法，老会有那种自己插不进去的感觉。旧室友那边更多是被骂、被拉着又被嘲笑，新的这边更像是我怎么努力都进不到他们里面。"}, {"candidate_id": "D", "text": "我可以先说旧室友那边，因为那个我印象更深。旧室友那会儿我总是围着他们转，还会被拉着玩、被嘲笑，我也一直想融进去，可是一直没办法。"}, {"candidate_id": "E", "text": "对，我本来也想融入新室友的圈子，但一直没办法，之前的宿舍关系也影响到我的学习和情绪。她们不爱学习，有时候我觉得自己也会受影响。"}, {"candidate_id": "F", "text": "最典型的应该是他们在宿舍里一起聊天的时候吧，几个人聊得很热闹，我就只能在旁边听着，想接话又总是接不上，最后就干脆不说了，感觉自己一下子又被晾在外面。其实我本来也想融入新室友的圈子，但一直没办法。"}, {"candidate_id": "G", "text": "那段时间我就更难学进去，老被影响。其实我本来也想融入新室友的圈子，但一直没办法。"}, {"candidate_id": "H", "text": "我心里通常会先一紧，可能会有点发慌，也会开始想他们是不是又在排斥我。其实我本来也想融入新室友的圈子，但一直没办法。"}]}, {"item_id": "I027", "candidates": [{"candidate_id": "A", "text": "I think the biggest thing is that I’ve been realizing how much I’ve been living by “shoulds” and other people’s expectations, and it’s left me feeling stressed and kind of out of sorts. I also want to talk about how to keep my own values, like self-respect, from getting lost in all of that."}, {"candidate_id": "B", "text": "I think I’m hoping that if I say yes or keep worrying about what they think, I’ll avoid disappointing people or being judged. But when I realize I’ve left my own wants out, I feel kind of sad and frustrated, because I can see I’ve been doing that for a long time. I’m also starting to see that self-respect has to come first for me now, and honestly I don’t think it’s ever really been in my top five before."}, {"candidate_id": "C", "text": "-and I feel like I can- I can, uh, respect and value myself just as much as I have other people. I know that's important. And I feel like when I do that, I'm a better person for other people as well."}, {"candidate_id": "D", "text": "It felt like I was seeing myself differently, like I could actually matter too. I’ve spent most of my life putting other people first and barely even putting myself in the picture."}, {"candidate_id": "E", "text": "I think the most painful part is how drained I feel when I keep putting everyone else first and ignore what I actually want. That’s when I get stressed and resentful, and it feels like I can’t even hear myself think, so the joy just kind of disappears. When I do focus on my own values, especially self-respect and inner harmony, I notice I feel lighter and more hopeful, and even my family feels less heavy to me."}, {"candidate_id": "F", "text": "Usually I get a little quiet if I can—step away, take a breath, or just stop talking for a minute so I can hear myself again. I think that’s part of why inner peace matters so much to me; with more self-respect, I feel like I’d have more creativity and more freedom too."}, {"candidate_id": "G", "text": "I think it would look like small things, like actually pausing before I say yes to something and asking myself if I really want to do it. Or choosing to spend time on something that feels good to me instead of automatically doing what I think other people expect. I’m not totally sure yet, because I’ve been so used to just going along with everyone else, but I think it would mean listening to myself more and not feeling like I have to earn my place all the time."}, {"candidate_id": "H", "text": "I think the most important thing is that I’ve been realizing how much I’ve been living for other people instead of myself. I’ve spent so long putting everyone else first, and lately I’ve started to see that it’s been making me stressed, resentful, and kind of out of touch with who I am. At the same time, I actually felt really good and great today, which made me notice that I can feel more like myself when I’m not carrying all that pressure. I want to figure out how to keep that feeling and make self-respect a real priority for me."}]}, {"item_id": "I028", "candidates": [{"candidate_id": "A", "text": "我想先学会慢一点分辨它到底是不是事实，因为我一冒出“我是不是又不够好”就会立刻很紧张、很压抑。其实我也知道适应需要时间，只是有时候这种担忧还是会让我觉得很无力。"}, {"candidate_id": "B", "text": "我觉得我最能接受的，大概是“我现在有点不方便，但不是不想帮你”，或者“这次我可能帮不了，但你可以找别人看看”。其实我也知道这需要时间慢慢适应，只是每次想到要拒绝，我还是会觉得很压抑、很无力。"}, {"candidate_id": "C", "text": "我觉得最容易的可能还是在合作刚开始、或者别人临时提出要我配合的时候，我先在心里停一下，不马上答应，也不急着把自己压下去。其实我也知道这种适应需要时间，但有时候这种担忧还是会让我觉得很压抑、很无力。"}, {"candidate_id": "D", "text": "我最怕的是我一开口就把事情弄糟，最后真的拖到大家。其实我也知道适应需要时间，但这种担心有时候会让我很压抑、很无力。"}, {"candidate_id": "E", "text": "嗯，我知道需要时间适应，但有时候这种担忧真的让我感到很压抑和无力。"}, {"candidate_id": "F", "text": "我觉得两边都有一点，但更强的还是怕自己被看成冷漠、没同理心的人，所以才会一下子很难拒绝。其实我也知道这种担忧需要时间慢慢适应，可有时候它真的会让我觉得很压抑、很无力。"}, {"candidate_id": "G", "text": "我通常会先拼命去补，想把事情做好，不太敢先退开；但有时候我也会想躲一下，怕自己一出手就出错。其实我也知道适应需要时间，只是这种担心一上来，还是会让我觉得很压抑、很无力。"}, {"candidate_id": "H", "text": "我想先从亲戚临时找我帮忙这种最常见的情况开始试试，先把那句“这次我先不方便”说出口。只是我也知道这需要时间适应，有时候光是想到要拒绝，我还是会觉得很压抑、很无力。"}]}, {"item_id": "I029", "candidates": [{"candidate_id": "A", "text": "我最怕的其实是我明明已经很努力去配合了，最后还是被人否定、嫌弃，或者根本没人真的在意我。也正因为之前有过那种很深的背叛感，我现在会更难再去信赖别人，总觉得一旦认真了又会受伤。"}, {"candidate_id": "B", "text": "我会先尽量让自己停一下，别立刻说话，或者先在心里把要回答的东西捋一遍，这样脑子不会一下子全乱掉。只是我也确实因为之前被深深背叛过，现在对别人很难再放心，所以一被盯着就更容易紧张。"}, {"candidate_id": "C", "text": "对，有些事情让我觉得被深深地背叛了，信任破裂得让我很难再去信赖别人。经济上的损失也让我压力倍增，我不得不强颜欢笑去应对一切。"}, {"candidate_id": "D", "text": "最难受的其实是那种一下子被很多人看着、特别丢脸的感觉，我会整个人都僵住，只想赶快逃开。那次之后我对别人也更不敢信了，感觉像是被很深地背叛了一样。"}, {"candidate_id": "E", "text": "我当时更像是害怕和委屈吧，心里一下子就缩起来了。也因为那种被背叛的感觉，我现在特别难再信别人。"}, {"candidate_id": "F", "text": "我心里最常说的就是“别说了，你说了也没用，还会被嫌烦”，所以就干脆把自己缩回去。其实我对人很难再信得过了，之前那种被背叛的感觉一直在。"}, {"candidate_id": "G", "text": "有，最近它对我学习和工作影响都挺明显的，我会更难集中，常常拖着不想开始，睡眠也不太好，晚上脑子里会一直转。还有就是我觉得自己被深深地背叛过，所以现在更难去信赖别人了。"}, {"candidate_id": "H", "text": "我最先想改变的还是那种一被压过来就立刻灰掉、垮掉的感觉，因为它一来我就什么都撑不住了。其实我也一直觉得自己像是被深深背叛过，所以现在很难再轻易信赖别人。"}]}, {"item_id": "I030", "candidates": [{"candidate_id": "A", "text": "更多是那种和别人隔着一层的孤单感吧，撑着本身就很累了，但最难受的是我还是觉得没人真的能碰到我。还有就是我情绪一波动，碰到争吵或者很吵的声音时，会很不舒服，有时候还会耳鸣，甚至短暂听不见。"}, {"candidate_id": "B", "text": "我觉得更多是在压住自己，我会先把那些不舒服按下去，不让它冒出来，表面上尽量保持平静。还有就是我情绪波动大的时候，像听到争吵或者很吵的声音，会很不舒服，有时候还会耳鸣，甚至会短暂听不见。"}, {"candidate_id": "C", "text": "最常见的就是他们会觉得我应该更懂事、更稳定一点，很多时候好像默认我得把学习和表现都做好，不能出错，也不能太情绪化。还有就是家里一吵起来，或者周围声音很乱的时候，我会特别不舒服，有时候还会耳鸣，甚至会突然听不太清。"}, {"candidate_id": "D", "text": "我觉得它很多时候就是从“怕被看见、怕被评价”开始的，一紧张就先缩起来，脑子里全是“我是不是又不够好”，所以越想稳住越容易乱。还有就是我情绪波动大的时候，像听到争吵或者很吵的声音，也会特别不舒服，有时候还会耳鸣，甚至短暂听不见。"}, {"candidate_id": "E", "text": "是的，情绪波动大的时候，比如听到争吵或吵杂的声音，我会感到不适，有时候会耳鸣，甚至会失去短暂的听力。"}, {"candidate_id": "F", "text": "更多的时候是难受和想躲开吧，像整个人都缩起来了，不太想碰任何事。还有就是一旦周围有争吵或者很吵的声音，我会更不舒服，有时候还会耳鸣，甚至短暂听不清。"}, {"candidate_id": "G", "text": "这种“玻璃”最常出现在我跟不太熟的人、尤其是比较正式的关系里，我会特别怕说错，所以总觉得隔着一层。还有就是一遇到争吵或者很吵的声音，我会一下子很不舒服，有时候还会耳鸣，甚至短暂听不见。"}, {"candidate_id": "H", "text": "我最常出现的感受是压力和害怕，觉得自己怎么做都不够。还有就是情绪一乱起来，听到争吵或者很吵的声音时，我会很不舒服，有时候还会耳鸣，甚至短暂听不见。"}]}, {"item_id": "I031", "candidates": [{"candidate_id": "A", "text": "我现在最想先说的是备考这件事，压力有点大。其实我有时候会想过放弃，但一想到之前付出的努力，又觉得很对不起自己。"}, {"candidate_id": "B", "text": "我最近最困扰的还是备考这件事吧，压力一大我就会特别敏感，情绪起伏也会变明显。明明一直很努力，但结果有时候又不如预期，就会很挫败，甚至会冒出“是不是怎么做都改变不了什么”的想法。它对我生活的影响就是很难真正放松，注意力也会被焦虑拉走，整个人总像绷着。虽然我也会想过放弃，但一想到之前付出的那些努力，又会觉得很对不起自己。"}, {"candidate_id": "C", "text": "选择……其实，我有时候确实会想过放弃，但每次想到放弃，我就会觉得真的很对不起之前付出的努力。尽管压力大，但我一直告诉自己再坚持一下，再坚持一下。"}, {"candidate_id": "D", "text": "它最常说的就是“你怎么又这样了”“你怎么还是没进步”，然后我就会一下子觉得自己很差。其实我也确实有过想放弃的时候，但每次一想到放弃，就会觉得很对不起之前付出的努力。"}, {"candidate_id": "E", "text": "我最近最困扰的还是自己总觉得很累，明明一直在努力，但一想到要继续撑下去就会有点想放弃。可我又会马上觉得，这样很对不起之前付出的那些努力，所以一直卡在那儿。"}, {"candidate_id": "F", "text": "嗯……我最近最困扰的，可能还是备考这件事吧。就是我明明一直很努力，但结果总是不太理想，所以会很失望，也挺挫败的。有时候压力一大，我就会特别敏感，情绪也容易被放大。其实我也会想过要不要干脆放弃，但一想到之前已经付出了那么多，又会觉得很对不起自己之前的努力，所以就一直卡在那种很纠结的状态里。"}, {"candidate_id": "G", "text": "最近最困扰我的，应该就是备考这件事吧。我有时候会想过放弃，但一想到之前已经付出了那么多努力，又会觉得很对不起自己。"}, {"candidate_id": "H", "text": "最近最困扰我的，还是备考这件事吧。我其实一直都很努力，也很想坚持下去，但很多时候结果又不如人意，就会特别失望、特别挫败。有时候我会觉得自己是不是再怎么努力也改变不了什么，心里很无力。其实我也有过想放弃的时候，可一想到之前付出的那些时间和精力，又会觉得很对不起自己，所以就一直卡在那种想继续又很累的状态里。"}]}, {"item_id": "I032", "candidates": [{"candidate_id": "A", "text": "我脑子里最常冒出来的就是“再撑一下，不能停，停了就会出错”，还有“先别乱，先把它顶过去”。其实我在工作里有时候也会撒些小谎，可能也是怕事情一下子失控。"}, {"candidate_id": "B", "text": "我通常会在心里一直催自己“别停，再看一遍，别出错”，然后就逼自己继续盯着，哪怕已经很累了，也会觉得再确认一次才安心一点。其实有时候我在工作里也会为了不那么麻烦，撒过一些小谎。"}, {"candidate_id": "C", "text": "我最先冒出来的通常是“完了，得赶紧把它弄住”，脑子会一下子很紧，身体也会跟着绷起来，像是马上就要出事了。其实我在工作里有时候也会撒些小谎，很多时候也是因为那种怕出问题、怕被追问的紧张感。"}, {"candidate_id": "D", "text": "我最怕的是一松手就出错，尤其是别人没按我想的做的时候。其实在工作里我有时候也会撒点小谎，可能也是怕事情更麻烦。"}, {"candidate_id": "E", "text": "我更担心的是会觉得自己不够好、不配放松，好像一停下来就会有罪恶感，也怕自己一松就真的出问题。其实我在工作里有时候也会撒些小谎，可能也是因为总想把事情先稳住。"}, {"candidate_id": "F", "text": "我最放不下的主要是那种需要我自己盯着、自己确认的事，尤其是怕一不小心就出错、最后还得我来收拾。还有就是工作里有些时候，我会为了先把事情过过去，撒一点小谎，但我心里其实也会一直不踏实。"}, {"candidate_id": "G", "text": "是的，在工作中我有时候会撒些小谎。可能是为了承担更多的责任，也许是为了让自己看起来更强大。"}, {"candidate_id": "H", "text": "我脑子里最先闪过的通常就是“别出错，还是我自己来吧”，不然一旦交出去就可能出问题。其实我在工作里有时候也会撒些小谎，就是想先把事情稳住，不让自己一下子陷进更麻烦的情况里。"}]}, {"item_id": "I033", "candidates": [{"candidate_id": "A", "text": "I think I’d need to keep that same simple routine even when the retreat isn’t there, so I’m still starting with prayer, my Bible, and not letting the phone set the pace. I also have to wait until I’m clear of the COVID infection before I can participate at the church building, so for now I’m trying to stay connected the best I can from home."}, {"candidate_id": "B", "text": "Yeah, I think I can keep reminding myself that the fear isn’t the whole truth, even if I don’t fully feel it yet. I still have to wait until I’m clear of the COVID infection before I can be back at the church building, so for now I’m just trying to stay steady."}, {"candidate_id": "C", "text": "A smallest sign would be if I noticed that “I should disappear” thought and paused before I shut down, even if all I did was stay in the conversation or keep myself from pulling away. I also need to wait until I’m clear of the COVID infection before I can participate at the church building, so for now I’m trying to stay present in the ways I can."}, {"candidate_id": "D", "text": "It brings me both comfort and a reminder of what I’m missing. I’m grateful for the comfort, but it also makes me wish I could be there in person again, and right now I still have to wait until I’m clear of the COVID infection before I can participate at the church building."}, {"candidate_id": "E", "text": "I think what helps me most is still praying right away and turning the service back on so I’m not sitting there alone with my thoughts. And I guess that’s also why I try to go to the annual retreat every year, because I missed it this year with COVID and I could really feel the difference."}, {"candidate_id": "F", "text": "Because of the way the feed is set up, I can not participate unless I am at the church building, and I need to wait until I am clear of the COVID infection first."}, {"candidate_id": "G", "text": "I’d want to notice that I’m still praying honestly, not just going through the motions, and that I’m reaching for God instead of shutting down when I feel heavy. I’m also still having to wait until I’m clear of the COVID infection before I can participate at the church building, so I’m trying to see that waiting as part of staying faithful too."}, {"candidate_id": "H", "text": "I usually tell myself to get back to prayer and not give up. I also have to wait until I’m clear of the COVID infection before I can be at the church building."}]}, {"item_id": "I034", "candidates": [{"candidate_id": "A", "text": "我最难受的其实是觉得他又一次把家里的处境和我们的感受放到后面了，好像他先顾着别人，最后才轮到我们。还有一次他为了帮后奶奶解决经济纠纷，明明被人辱骂和威胁，最后还赔了钱，连尊严都搭进去了，我就更觉得他这样太不值得了。"}, {"candidate_id": "B", "text": "有一次，他为了帮后奶奶解决一个经济纠纷，甚至不惜被人辱骂和威胁，最后不仅赔了钱，还赔上了自己的尊严。"}, {"candidate_id": "C", "text": "我希望别人能先相信我们真的会受伤，别一上来就觉得我们太敏感。还有，我爸那次为了帮后奶奶处理纠纷，被人骂和威胁，最后还赔了钱，我就更觉得他太委屈自己了。"}, {"candidate_id": "D", "text": "我身体上通常会先一紧，胸口有点堵，脑子里会一下子冒出“又来了，我是不是又要退了”的念头，然后就很想先把话咽回去。其实我也会立刻想到我爸有一次为了帮后奶奶处理经济纠纷，被人骂、被威胁，最后还赔了钱和尊严，我就更容易觉得这种忍让特别不值。"}, {"candidate_id": "E", "text": "更多的是替你和我妈觉得委屈，也会有一点心疼他，但委屈和不值的感觉更强。尤其我还会想到有一次他为了帮后奶奶处理经济纠纷，被人骂、被人威胁，最后钱也赔了，连尊严都搭进去，我就更觉得他这样太让人憋屈了。"}, {"candidate_id": "F", "text": "我最想守住的，其实是我自己的底线吧，我不想最后也变成那种明明心里很不舒服，却还是一味退让、把自己放到很低的位置的人。还有我也很怕，像我爸爸那次为了帮后奶奶处理经济纠纷，被人辱骂和威胁，最后钱和尊严都赔进去，这种事我不想让自己也走到那一步。"}, {"candidate_id": "G", "text": "我觉得最容易让我想退、最不敢说的，还是在家里那种我明明觉得不对、但又怕一说出来就更僵的时候，尤其是面对我爸这种我看不懂又很容易让我失望的人。还有就是我爸为了帮后奶奶处理经济纠纷，被人辱骂和威胁，最后还赔了钱、赔了尊严，这种事也会让我更觉得，很多时候他就是一直在往后退。"}, {"candidate_id": "H", "text": "我最受不了的其实是他那种不反抗，因为那会让我觉得他连保护自己都做不到，也会让我更看不起他。像你说的那次为了后奶奶的经济纠纷，他被人骂、被威胁，最后还赔了钱和尊严，我就更觉得他太容易把自己搭进去了。"}]}, {"item_id": "I035", "candidates": [{"candidate_id": "A", "text": "我脑子里最先闪过的通常就是“我是不是又要让别人失望了”“我一开口会不会就被嫌烦”，然后整个人就像一下子被卡住了，什么都说不出来。每当我感到压力或者恐惧的时候，那种无形的枷锁就会更紧地把我锁住，让我动弹不得。"}, {"candidate_id": "B", "text": "每当感觉到压力或恐惧时，那种无形的枷锁就会紧紧地锁住我，让我动弹不得。我不知道怎么挣脱出来，只能在心里不停地挣扎。"}, {"candidate_id": "C", "text": "它最常在我一感觉到压力或者害怕的时候冒出来，尤其是要面对别人、怕自己做不好、怕被嫌弃的时候，那种“我不够好”的感觉就会一下子很强。然后我就会像被那种无形的枷锁更紧地锁住，整个人都动不了。"}, {"candidate_id": "D", "text": "我最怕的是，一旦我表达出来，别人会觉得我很麻烦、很烦，然后就开始躲我、疏远我，或者直接不想理我了。尤其是我一有压力或者害怕的时候，那种无形的枷锁就会一下子勒得很紧，让我整个人都动不了，所以我就更不敢说了。"}, {"candidate_id": "E", "text": "对，尤其是我一有压力或者一害怕的时候，那种无形的枷锁就会一下子勒得更紧，我就会更动不了。然后我就只能先硬撑着，怕自己一松就彻底乱掉。"}, {"candidate_id": "F", "text": "我觉得在面对室友的时候最明显，一紧张就会特别怕说错话、怕她们不高兴；一个人的时候也会有，但没那么强。其实一有压力或者害怕，那种看不见的枷锁就会一下子把我锁住，让我整个人都动不了。"}, {"candidate_id": "G", "text": "我脑子里通常会冒出“别说了，别再添麻烦了”，然后就很想躲开，不想面对任何人。其实一有压力或害怕，那种无形的东西就会一下子把我锁住，我就动不了了。"}, {"candidate_id": "H", "text": "我最先会觉得胸口很紧，脑子一下子空掉，然后就特别想缩起来，甚至赶紧离开那个地方。其实一有压力或者害怕，那种无形的枷锁就会一下子锁住我，让我动都动不了。"}]}, {"item_id": "I036", "candidates": [{"candidate_id": "A", "text": "我最先的反应通常是心里一下子发紧，胸口也会有点闷，整个人会突然慌起来，脑子里就开始反复想是不是他又不在意我了。然后我会很想马上去看手机、去确认一下，不然就会一直悬着。其实我也慢慢觉得，我对他的感情算是理清了一些，也知道自己可能还是得多学着独立一点、对自己更有信心。"}, {"candidate_id": "B", "text": "我想先聊怎么和他相处，因为我还是很在意他到底会不会及时回应我。前几天我还看到一篇说情感里要保持自我独立的文章，也挺有共鸣的。"}, {"candidate_id": "C", "text": "我明白他想表达的意思，但我觉得这有些理想化。现实生活中，我们是需要通过关系互相支持和依赖的，不可能完全独立。"}, {"candidate_id": "D", "text": "我可能会先不给自己那么大的压力，不是一下子就去确认他，而是先缓一缓，做点别的事把情绪降下来。只是我也会觉得，现实里关系本来就需要互相支持和依赖，我不可能真的完全靠自己。"}, {"candidate_id": "E", "text": "最让我受伤的，可能就是那种他一旦没有及时回应，我就会突然觉得自己像是被晾在一边了，像不太被需要、不太被放在心上。后来我也看到过一些关于情感依赖和保持自我独立的说法，挺有共鸣的，所以我也会一边很想靠近，一边又提醒自己别太依赖他。"}, {"candidate_id": "F", "text": "我第一反应通常会觉得，是不是他不够在乎我，或者我又被放到后面了，所以才会这么慌。其实我也会觉得现实里关系本来就需要互相支持和依赖，不可能完全靠自己撑着。"}, {"candidate_id": "G", "text": "我觉得最容易做到的，还是先把手机放下，去做点别的事，让自己别一直陷在等他回消息的状态里。只是对我来说，我也没法真的完全一个人扛着，我还是会觉得关系里本来就需要互相支持和依赖。"}, {"candidate_id": "H", "text": "可能两种都有，但如果一定要选，我更难受的还是怕失去他。因为一想到他不在乎我，或者我们的关系会变得很远，我就会特别慌，像没有依靠一样；但同时我也会马上觉得自己是不是太黏人、太敏感了，这一点也让我很压抑。其实我也知道关系里不可能完全不需要对方，可我还是会因为这种需要而有点自责。"}]}, {"item_id": "I037", "candidates": [{"candidate_id": "A", "text": "那时候我大约二十几岁吧。第一次有离婚念头是在孩子生病后的那段时间，面对家庭的种种压力和争执，我真的觉得自己再也无法继续下去了。"}, {"candidate_id": "B", "text": "我最先想到的还是家会不会真的乱掉，孩子那边会不会又出什么事，因为我总觉得只要我一停，很多事就会没人管。可更深一点，我也会怕别人觉得我不够好、撑不住；那时候面对家里的压力和争执，我真的一度觉得自己再也无法继续下去了。"}, {"candidate_id": "C", "text": "更像是觉得自己在这个家里已经没位置了，也很想逃开那种压力。那时候我真的觉得自己再也撑不下去了。"}, {"candidate_id": "D", "text": "我最放不下的，好像就是孩子和这个家吧，我总觉得只要我一停，事情就会更乱，孩子也会更难受，所以我不敢真的停下来。其实那时候面对家里的各种压力和争执，我真的有过一种再也撑不下去的感觉。"}, {"candidate_id": "E", "text": "我最盼着变好的，其实是我自己不用再总是一个人扛着，家里能少一点争执，至少有人能真正站在我这边听我说话。那时候面对家里的压力和争吵，我真的一度觉得自己再也撑不下去了。"}, {"candidate_id": "F", "text": "我最舍不得放下的，其实就是孩子吧，我总觉得一放下这个家，孩子就更没人照顾了。可那时候面对家里的压力和争执，我真的也有过一种感觉，就是自己再也撑不下去了。"}, {"candidate_id": "G", "text": "那次最让我下定决心的，其实不是某一件小事，而是那种长期被忽视、被压着的感觉一下子到了顶点，我真的觉得再这样下去自己快撑不住了。那时候面对家里这些压力和争执，我心里很清楚地冒出来一个念头：我真的再也无法继续下去了。"}, {"candidate_id": "H", "text": "我觉得两边都有，但更重的是那种失望吧，就是明明一直在扛，却还是没人真正分担，我会很心寒。那时候我面对家里的压力和争执，真的一度觉得自己再也撑不下去了。"}]}, {"item_id": "I038", "candidates": [{"candidate_id": "A", "text": "我现在能想到的，可能就是我妈吧，虽然她也有很多缺点，但她一直还是在尽力照顾我们，我有时候会想先找她待一会儿。只是我也会担心她现在病得这么重，我反而不知道还能不能真的帮到她。"}, {"candidate_id": "B", "text": "更多是很绝望、很心疼，不是真的想让她死。其实我妈虽然也有很多缺点，但她一直还是尽力在照顾我们。"}, {"candidate_id": "C", "text": "我最怕它把我带到那种彻底撑不住、什么都顾不了的地方，好像一松手我就会整个人塌下去，最后又只剩我一个人面对。可我也知道，我妈虽然有很多缺点，但她其实一直还是在尽力照顾我们，所以我才会这么怕她真的出事。"}, {"candidate_id": "D", "text": "我更想先把这股火说出来，因为我真的很憋，也很不服；但我也会忍不住想冲上去护着我妈。她虽然有很多缺点，可我还是觉得她一直在尽力照顾我们。"}, {"candidate_id": "E", "text": "我更想说的是那种压迫和冷漠吧，他一直让我觉得我怎么做都不对，慢慢就把我弄得很没底气。其实我妈虽然也有很多缺点，但我还是觉得她一直在尽力照顾我们。"}, {"candidate_id": "F", "text": "我说的更像是希望她少受点苦，不是真的在想让她出事；我只是看她一直这么痛苦，心里会很难受。其实我也知道，我妈虽然有很多缺点，但她一直还是在尽力照顾我们。"}, {"candidate_id": "G", "text": "我最担心的是她身边没人照顾，也怕她现在这个身体状况根本撑不住，连住的地方都不稳定。其实我也知道她有很多缺点，但她这些年还是一直在尽力照顾我们。"}, {"candidate_id": "H", "text": "嗯...是指她对我们子的关爱吧，尽管她也有很多缺点，但她还是尽力在照顾我们。"}]}, {"item_id": "I039", "candidates": [{"candidate_id": "A", "text": "我通常会先退开一点，话也会变少，先观察对方的反应，心里会一直绷着，怕自己一靠近就又受伤。其实我也会觉得，那个最能理解我的人已经不在了，所以很多时候我会更像是一下子失去了支撑。"}, {"candidate_id": "B", "text": "对，唯一能理解我的人不在了，我感到彻底失去了心理支撑。我的状态因此变得更加不稳定。"}, {"candidate_id": "C", "text": "通常是那种一开始看起来很像懂我、也会让我觉得有点被接住的人，但慢慢又会让我感觉要我一直配合、一直撑着，最后还是只剩我自己在扛。其实我现在也会特别难受，因为我觉得唯一能真正理解我的人不在了，像是一下子把我最重要的心理支撑也拿走了。"}, {"candidate_id": "D", "text": "我晚上安静下来的时候，最常冒出来的就是“是不是又是我没做好”“我是不是又把事情弄坏了”这种话，脑子会一直转，停不下来。其实有时候我也会觉得，那个最能理解我的人已经不在了，我好像一下子就没了可以依靠的心理支撑。"}, {"candidate_id": "E", "text": "我从小就觉得说了也没用，后来更是慢慢不敢说了。其实我一直觉得唯一能理解我的人不在了，像是连支撑都没了。"}, {"candidate_id": "F", "text": "我最先会压下去的，通常是那种委屈、难受，还有“我其实撑不住了”的感觉吧，我会下意识觉得先别说，免得给别人添麻烦。其实我有时候也会觉得，那个最能理解我的人已经不在了，像是一下子连心理支撑都没了。"}, {"candidate_id": "G", "text": "我最常压下去的，其实是那种很想被人理解、很想有人接住我的感觉，但我又会觉得说出来也没用，所以就干脆憋着。也正因为这样，我总觉得唯一能真正理解我的人不在了，连心理支撑都像一下子没了。"}, {"candidate_id": "H", "text": "更多的时候其实是难过和舍不得，只是那个害怕会更大，所以我才会先把关系断掉。也因为我觉得唯一能真正理解我的人不在了，我会更觉得自己像是彻底没了心理支撑。"}]}, {"item_id": "I040", "candidates": [{"candidate_id": "A", "text": "我最希望他先听见的是：我真的不是故意做不好，也不是不想努力，我只是太紧张了，已经很尽力了。还有就是，我考试成绩不理想的时候，我妈妈会很生气地训斥我，我爸爸通常只是在旁边叹气，等我妈妈走了以后才会安慰我几句。"}, {"candidate_id": "B", "text": "比如我考试成绩不理想，妈妈会很生气地训斥我，而爸爸只是会在旁边叹气，然后等妈妈离开后才说几句安慰的话。"}, {"candidate_id": "C", "text": "我更受不了的其实是我自己先把“被看见”直接等同成“我完了”，因为一这样想，我就马上乱掉，连别人到底有没有真的在评价我都分不清了。也可能是我太习惯把别人的眼光往坏处想了，比如我考试考得不好的时候，我妈会很生气地训我，我爸通常就在旁边叹气，等她走了才会说几句安慰的话。"}, {"candidate_id": "D", "text": "我最想被妈妈先看见吧，别一上来就批评我、否定我，能先听我把话说完，哪怕只是安静地听一下，我都会觉得没那么孤单。其实我考试考得不理想的时候，妈妈常常会很生气地训我，我爸就在旁边叹气，等我妈走了才会安慰我几句，所以我总觉得自己还是得一个人扛着。"}, {"candidate_id": "E", "text": "除了当众发言，我在开会的时候也会紧张，尤其是需要临时开口或者做展示的时候，会更怕自己说乱。对了，我考试成绩不理想的时候，我妈妈也会很生气地训我，我爸爸一般就在旁边叹气，等她走了才会安慰我几句。"}, {"candidate_id": "F", "text": "我最希望有人能先站在我这边，告诉我不是我一个人的错。像我考试考得不理想时，我妈会直接训我，我爸通常只是叹气，等她走了才安慰我几句。"}, {"candidate_id": "G", "text": "我脑子里最先冒出来的通常是“别说了，说了也会被挑错”“还是算了吧”。而且我一考试成绩不理想，我妈就会很生气地训斥我，我爸一般只是叹气，等我妈走了才安慰我几句。"}, {"candidate_id": "H", "text": "那一刻我最先冒出来的其实是很强的羞耻感，觉得自己一下子又把事情搞砸了，好像真的很丢人。然后我妈越是生气、越是训我，我就越觉得只能一个人扛着；我还记得我考试考得不好的时候，她会很生气地骂我，我爸就在旁边叹气，等她走了才会安慰我几句。"}]}, {"item_id": "I041", "candidates": [{"candidate_id": "A", "text": "最难受的其实是失望，也有一点不甘心吧，会觉得自己已经很努力了，还是没办法真正按自己的想法来。以前我也总是先压着自己的想法，更多顺着别人，后来才慢慢学着坚持一点自己的意见。"}, {"candidate_id": "B", "text": "我更在意会不会不被接纳，怕别人觉得我很怪。其实我以前总是先压抑自己、顺着别人，后来才慢慢学会坚持自己的意见。"}, {"candidate_id": "C", "text": "我觉得最容易让我妥协的，还是害怕冲突，也害怕关系一下子变得很僵，尤其是面对妈妈的时候，我就会更想先退一步。以前我其实总是更容易压着自己的想法去顺着别人，后来才慢慢学着坚持自己的意见。"}, {"candidate_id": "D", "text": "更多的是被轻视、被欺负的委屈吧，因为那种感觉会让我一下子觉得自己更没地方站了。其实我以前也总是先压着自己的想法、顺着别人，后来才慢慢学着坚持自己的意见。"}, {"candidate_id": "E", "text": "是的，以前我总是倾向于压抑自己的想法，更多地顺从别人，后来才慢慢学会了坚持自己的意见。"}, {"candidate_id": "F", "text": "我觉得最先触发我的，还是那种“快要被看出来了”的感觉，一想到这个我就会马上紧张，脑子也会乱掉。其实我以前很多时候都更容易压着自己的想法，先顺着别人来，后来才慢慢学着坚持自己的意见。"}, {"candidate_id": "G", "text": "我一般会先忍着，把情绪压下去，表面上先装作没事，等离开了才会自己很难受。其实我以前总是更容易压抑自己的想法、顺着别人，后来才慢慢学会了一点点坚持自己的意见。"}, {"candidate_id": "H", "text": "更多的时候是我自己先对自己下了这个判断，因为我一紧张就会先把自己往不好的方向想，觉得自己是不是又在给别人添麻烦、是不是很难相处。其实我以前总是倾向于压抑自己的想法，更多地顺从别人，后来才慢慢学会了坚持自己的意见。"}]}, {"item_id": "I042", "candidates": [{"candidate_id": "A", "text": "我最担心的通常是，一旦我缩回去，就会真的把事情拖坏，然后最后又变成“你看吧，你果然不行”，所以我会更不敢动。其实我上大学去外地以后，离开家那段时间我才慢慢开始想自己的生活方式，也更明显地反思起父母对我的影响。"}, {"candidate_id": "B", "text": "我觉得有一点具体的做法，就是先在心里把那句最想说的话默念一遍，哪怕只说出前半句也行，不用一下子说完整；不然我一紧张就真的会卡住。还有就是我也越来越觉得，随着年龄增长，我得慢慢学会有自己的生活和思考方式，不能总是被那种“先别说”的习惯带着走。"}, {"candidate_id": "C", "text": "我最希望的是，对方先别急着评我对不对，能先把语气放缓一点，告诉我“你慢慢说，我在听”，或者先肯定一下我不是一下子就不行了，这样我会比较不容易慌。也可能是因为我现在越来越觉得，随着年纪大一点，我确实需要慢慢学着有自己的生活和思考方式。"}, {"candidate_id": "D", "text": "最容易让我焦虑的还是考试、工作压力，还有跟人打交道的时候，一到这些场景我就会特别容易紧张，脑子里也会一直转。最近我也越来越觉得，随着年纪大一点，我确实开始意识到自己需要有更独立的生活和思考方式。"}, {"candidate_id": "E", "text": "主要是在学习和日常安排上，他们会想替我决定。随着我年龄增长，我也越来越觉得自己需要有独立的生活和思考方式。"}, {"candidate_id": "F", "text": "最近一次就是前几天吧，我本来想自己安排一件事，结果他们又开始说应该怎么做、怎么选，我就一下子很烦，觉得又被管住了。也就是从那时候开始，我越来越觉得自己真的需要有独立的生活和思考方式。"}, {"candidate_id": "G", "text": "我可能会先试着从最小的事开始，比如自己的作息先由我来安排，看看能不能不那么快就退回去。其实我也慢慢意识到，随着年龄增长，我确实需要有更独立的生活和思考方式。"}, {"candidate_id": "H", "text": "我觉得随着我年龄的增长，我开始意识到自己需要有独立的生活和思考方式。我意识到他们的控制对我的心理产生了负面影响，尤其是母亲的焦虑情绪更是让我在遇到困难时更加焦虑和无助。"}]}, {"item_id": "I043", "candidates": [{"candidate_id": "A", "text": "我觉得最小的一步，可能就是先不急着把别人当成要来评判我的人，哪怕只是在心里多停两秒，先把自己稳住，再试着说一句真实的话。其实我有时候也会很想抓住一种能把我从这种孤独和绝望里拉出来的关系，好像只有那样我才不用一直一个人扛着。"}, {"candidate_id": "B", "text": "我通常会先更想把自己缩起来，不太说话，或者干脆想找个能让我一下子靠住的人，最好有人能直接把我从这种状态里拉出来。其实我一直都很渴望一种能拯救我的关系，因为我心里特别空，也很孤独。"}, {"candidate_id": "C", "text": "最容易让我一下子觉得装不下的，还是那种要跟人接触、又感觉自己得表现得很自然的时候，尤其对方一冷淡或者没马上回应，我就会一下子很慌，觉得压力一下全堆上来了。其实我心里也会很想有一种能把我拉住、拯救我的关系，因为我总觉得自己里面很空，很孤独。"}, {"candidate_id": "D", "text": "我最常伪装的应该是那种很脆弱、很没底气的自己吧，我会尽量表现得平静一点、冷一点，好像我并不在意别人怎么看，其实心里很怕被嫌弃。只是我也发现，我好像一直都很想有一种能把我接住、甚至拯救我的关系，因为我里面真的挺空、挺孤单的。"}, {"candidate_id": "E", "text": "最容易把我顶到快崩溃边缘的，还是那种一下子涌上来的孤独和绝望感，尤其是我觉得没人能真的接住我的时候，我就会特别慌。可能也因为这样，我一直会很渴望有一种能把我稳住、甚至像救我一样的关系。"}, {"candidate_id": "F", "text": "我会很在意对方是不是真的愿意停下来听我，不是那种表面陪着、心里已经在评判我的感觉，而是能让我慢慢说完、也不用马上变好的那种。其实我有时候也会很想有一个能把我从这种孤独里真正拉出来的人，像是能拯救我一样。"}, {"candidate_id": "G", "text": "我觉得最重要的是那种让我一下子被接住、别再一个人扛着的感觉。其实我心里会很渴望有个像救我出来的人，因为我总觉得自己很匮乏，也很孤独。"}, {"candidate_id": "H", "text": "我觉得自己一直在寻找一种能够拯救我的关系，因为我内心特别匮乏，内心的孤独和绝望让我渴望一个救世主般的存在。"}]}, {"item_id": "I044", "candidates": [{"candidate_id": "A", "text": "我更像是觉得我们之间很难真正连上，因为我好像一直都只是在被看结果，没被看见我这个人。也正因为这样，我会觉得我父母现在对我成绩不好很失望。"}, {"candidate_id": "B", "text": "我会拿成绩和未来来要求自己，觉得自己必须做得很好，不然就不够好。也因为这样，我总觉得我父母现在对我成绩不好很失望。"}, {"candidate_id": "C", "text": "我最先冒出来的其实是“我又不被看见了”，然后才会有一点害怕和烦躁。尤其是我觉得我父母现在对我成绩不好很失望的时候，我就更容易这样想。"}, {"candidate_id": "D", "text": "我最担心的就是他会马上皱着眉，觉得我又在想这些没用的东西，然后把话一下子拉回成绩，或者直接说我现在这样不够努力。其实我也会很怕他失望，因为我现在就已经觉得我父母对我成绩不好很失望了。"}, {"candidate_id": "E", "text": "我最希望换来的其实是先别那么慌，能让我暂时停一下，不用一直把自己逼得那么紧；因为我一停下来就会更害怕。还有，我也很在意让爸爸看到我真的已经很努力了，可我又总觉得我父母现在对我成绩不好很失望。"}, {"candidate_id": "F", "text": "我觉得两边都有，但更刺痛我的，可能还是那个“我会让家里失望、连自己都没法面对”的感觉。因为成绩掉下去本身当然也会让我难受，可更让我慌的是，它好像一下子就会变成一种对我的否定，像是在说我真的不够好，真的会让爸爸失望，甚至会让我觉得自己好像没法再抬头了。想到这个我就会特别害怕，所以才会一直想把自己拉回来，不敢真的松。"}, {"candidate_id": "G", "text": "我就是觉得特别无力，感觉自己很难和他们沟通。小时候总是要做他们的骄傲，现在我成绩不好，他们虽然没有明说，可我觉得他们很失望，我自己也特别焦虑。"}, {"candidate_id": "H", "text": "我最想让他听见的是，我不是故意不努力，也不是在顶嘴，我是真的压力很大，心里很难受，我希望他先别急着否定我，能先听我把这些话说完。其实我也会觉得我爸妈现在对我成绩不好很失望。"}]}, {"item_id": "I045", "candidates": [{"candidate_id": "A", "text": "我觉得最重的还是家里对我的期待吧，尤其是爸妈一直很关注我学习的情况，我就会特别有压力。因为我总觉得自己不能让他们失望，必须要考上研究生，才算没有辜负他们。可是一想到这个，我就会很紧张，甚至有点喘不过气来。其实我也不是不想努力，只是这种压力一直压着我，让我很难真正放松下来。"}, {"candidate_id": "B", "text": "我希望他能更加关心我的内心感受和我的兴趣，而不仅仅是关注我的成绩。如果达不到他的期望，我的确会感到自责，觉得自己不够好。"}, {"candidate_id": "C", "text": "我觉得可能还是家里的压力更让我难受一点，因为我一想到爸妈对我的期待，就会特别慌，怕自己没做到他们想要的，也怕考不上研究生让他们失望。然后这种慌一上来，我晚上就更睡不着了。"}, {"candidate_id": "D", "text": "我脑子里最常冒出来的就是“我是不是不够好”，还有“要是考不好，他们肯定会很失望”。一想到这个，我就会特别内疚，也会觉得自己好像必须再逼自己一点。"}, {"candidate_id": "E", "text": "有，白天注意力也会差一点，情绪也更烦。 我也会一直担心自己不够好，怕考不上研究生让爸妈失望。"}, {"candidate_id": "F", "text": "我感觉可能是两边都有，但如果一定要选一个的话，还是“怕辜负家里的期待”更让我难受一点。因为选错路我会焦虑，可一想到他们对我有那么多期待，我就会特别内疚，觉得自己好像怎么选都不对，怕让他们失望，也怕他们觉得我不够好。然后这种感觉一上来，我就更睡不着了，脑子里一直转这些事。"}, {"candidate_id": "G", "text": "我脑子里最强烈的就是“我怎么又让他们失望了”，还有“我是不是真的不够好”。一想到这个，我就特别难受，也会更想躲开，不敢去面对学习。"}, {"candidate_id": "H", "text": "我脑子里最常冒出来的就是“你怎么连这点都做不好”“你要是再这样下去，大家都会失望”。有时候还会变成“你明明知道他们对你有期待，为什么还是这么没用”。一想到这些，我就会更想逼自己，可越逼越觉得自己真的不够好。"}]}]</script><script>
'use strict';
const items=JSON.parse(document.getElementById('evaluation-data').textContent);
const labels=['更像真人','不确定','更像 AI'];
const answers=Object.create(null);
let page=0;
const app=document.getElementById('app');
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function welcome(){app.innerHTML=`<main class="welcome"><p class="eyebrow">来访者表达评估 · 匿名展示</p><h1>听见表达，<br>做出你的判断。</h1><p class="intro">请仅根据来访者的语言与表达，判断每段片段更像真人、不确定，还是更像 AI。</p><div class="facts"><div><strong>45</strong><span>个案例</span></div><div><strong>8</strong><span>段表达 / 案例</span></div><div><strong>3</strong><span>种判断</span></div></div><div class="instructions"><h2>评估说明</h2><p>每页对应一个案例，8 段候选围绕同一披露信息。每段独立判断，可给多个候选相同类别，无需选出唯一真人。</p><p>每个候选只呈现一轮完整的来访者发言。信息不足时可选择“不确定”。正式评估要求独立完成，不与其他标注者讨论。</p><p>此页面展示评估界面与题目，可自由浏览全部案例。点击类别可体验界面，选择不会提交或保存。</p></div><button class="primary start" id="start">浏览评估题目 <span aria-hidden="true">→</span></button></main>`;document.getElementById('start').onclick=()=>render();}
function render(){const item=items[page]; const selected=item.candidates.filter(c=>answers[item.item_id+':'+c.candidate_id]).length;
app.innerHTML=`<header class="topbar"><div class="header-inner"><div class="header-title"><span class="brand">来访者表达评估</span><span class="count">匿名展示 · 45 个案例</span></div><div class="header-actions"><label for="case-select" class="demo-note">跳转案例</label><select id="case-select" class="case-select" aria-label="跳转案例">${items.map((_,i)=>`<option value="${i}" ${i===page?'selected':''}>案例 ${String(i+1).padStart(2,'0')}</option>`).join('')}</select></div></div><p class="save-notice">仅供浏览；选择不会提交或保存。</p></header><main class="assessment"><div class="case-heading"><div><p class="eyebrow">CASE ${String(page+1).padStart(2,'0')} / 45</p><h1>案例 ${String(page+1).padStart(2,'0')}</h1></div><span class="pill">${selected} / 8 已选择</span></div><p class="case-help">以下 8 段表达围绕同一信息，请逐段独立判断。</p>${item.candidates.map((c,i)=>`<article class="candidate"><div class="candidate-heading"><h2>候选 ${escapeHtml(c.candidate_id)}</h2><span>${i+1} / 8</span></div><p class="client-text">${escapeHtml(c.text)}</p><div class="choices" role="group" aria-label="候选 ${escapeHtml(c.candidate_id)} 的分类">${labels.map((label,j)=>{const active=answers[item.item_id+':'+c.candidate_id]===label;return `<button class="choice choice-${j}${active?' selected':''}" data-candidate="${escapeHtml(c.candidate_id)}" data-label="${j}" aria-pressed="${active}"><span class="radio" aria-hidden="true">${active?'✓':''}</span>${label}</button>`;}).join('')}</div></article>`).join('')}<nav class="navigation" aria-label="案例翻页"><button class="secondary" id="prev" ${page===0?'disabled':''}>← 上一案例</button><button class="primary" id="next" ${page===items.length-1?'disabled':''}>下一案例 →</button></nav><p class="footnote">案例 ${page+1} / 45 · 匿名展示</p></main>`;
document.getElementById('case-select').onchange=e=>move(Number(e.target.value));
document.getElementById('prev').onclick=()=>move(page-1);
document.getElementById('next').onclick=()=>move(page+1);
app.querySelectorAll('[data-candidate]').forEach(button=>button.onclick=()=>{const y=window.scrollY;answers[item.item_id+':'+button.dataset.candidate]=labels[Number(button.dataset.label)];render();window.scrollTo(0,y);});}
function move(n){if(!Number.isInteger(n)||n<0||n>=items.length)return;page=n;render();window.scrollTo(0,0);}
welcome();
</script></body></html>
